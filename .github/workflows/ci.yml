name: CI

on:
  pull_request:
  push:
    branches: [main]

# `main`'de HER commit dogrulanir; iptal yalniz PR'larda. (2026-08-09 bulgusu: `main`'de de
# iptal acikti → art arda push'larda 35 dk'lik Windows `rust` isi her seferinde oldurulyordu.
# Sonuc bir kisir dongu idi: is bitmeyince `rust-cache` **kaydedilmiyor**, sonraki kosu yine
# soguk basliyor, yine 35 dk suruyor, yine iptal ediliyordu → main'de aylardir yesil Rust
# sinyali YOKTU. `msrv` isi bitip cache yazabildigi icin 1,5 dk'da kosuyordu; fark buradan.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Node 20 kullanimdan kalkti (GitHub runner'lari zorla 24'e dusuruyor + uyari basiyor).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    runs-on: windows-latest
    # 60 dk: SOGUK cache'te clippy(--all-targets) + tum workspace testleri Windows'ta 35 dk'yi
    # asabiliyor. Sinir dusuk kalirsa is timeout'a duser, cache yine yazilmaz ve dongu surer.
    # Cache bir kez yazildiktan sonra tipik kosu bunun cok altinda kalir.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      - run: cargo check --workspace --locked
