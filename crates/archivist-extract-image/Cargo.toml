[package]
name = "archivist-extract-image"
version = "0.1.0"
description = "Arsiv-H3 gorsel cikaricilari — EXIF, pHash, baskin renk (CIELAB k-means), thumbnail, video (MP4 atom), sekil. H2'den nakil."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
archivist-extract.workspace = true
archivist-thumbnail.workspace = true
image.workspace = true
kamadak-exif = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Video poster karesi: Windows Shell'in kurulu codec/thumbnail saglayicisini kullanir.
# Harici ffmpeg kurulumu ya da buyuk bir decoder sidecar'i gerektirmez.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
