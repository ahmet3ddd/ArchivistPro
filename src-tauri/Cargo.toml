[package]
name = "archivist"
version = "3.6.1"
description = "Arsiv-H3 — offline mimari arsiv yonetim uygulamasi (Tauri kabugu)"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "archivist"

# Tauri v2: lib (mobil-hazir/yeniden-kullanim) + binary giris.
[lib]
name = "archivist_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# Klasor-secici dialog (ingest icin yol-yazma yerine yerel klasor secimi).
tauri-plugin-dialog = "2"
# Dosyayi OS varsayilan uygulamasiyla ac + dosya yoneticisinde goster (§R file-ops) —
# `opener` crate (ShellExecuteW; open_commands.rs). tauri-plugin-opener KALDIRILDI (2026-07-07):
# 2.5.4 Windows'ta Unicode/bosluk iceren GECERLI yollarda (or. Turkce adli "Ekran goruntusu
# ....jpg") sessizce basarisizdi; ShellExecuteW (Invoke-Item ile ayni yol) aciyor — kanit commit 8baa515.
opener = { version = "0.7", features = ["reveal"] }
serde.workspace = true
serde_json.workspace = true
archivist-db.workspace = true
# Cok-arsiv tasima (export/import): kopyanin/kaynagin app_meta manifest'ini ham SQLite
# baglantisiyla yaz/oku (peek). Ayni derlenmis rusqlite'i archivist-db ile paylasir
# (workspace features birlesir → tek build). Bkz archive_share.rs.
rusqlite.workspace = true
archivist-extract.workspace = true
# DWG sekil-arama (Dilim 3): gorsel-sorgu cikarimi (extract_shape_from_bytes) + ShapeFeatures.
# Workspace crate → additive; agir image/exif bagimliliklari bu crate'te zaten izole.
archivist-extract-image.workspace = true
archivist-ingest.workspace = true
# Faz 5.1 — metin embedding motoru (ort + tokenizers + MiniLM). Semantik arama.
archivist-embed.workspace = true
# LAN salt-okuma dagitim/bildirim sunucusu (S1-S2 MVP). Senkron tiny_http (kendi thread'inde);
# DB'yi sahiplenmez → bildirimleri enjekte closure ile ceker (lan_commands.rs).
archivist-server.workspace = true
# H2→H3 kayipsiz veri aktarimi (kullanici karari 2026-08-10): kesif + envanter +
# kuru kosu + uygula cekirdegi. Komut katmani ince kabuk (h2_import_commands.rs).
archivist-h2import.workspace = true
# Thumbnail baytlarini IPC icin base64'e kodla.
base64.workspace = true
# AI vision-analiz: kaynak raster dosyadan daha yuksek-cozunurluk (~768px) onizleme uret
# (depolanan 256px thumb az detay verir → yuzeysel betim). encode_sized/image_preview_from_bytes.
archivist-thumbnail.workspace = true
# RAG sohbet (Artim 4): Ollama HTTP (yalniz localhost). Hafif blocking istemci — senkron
# komutlarla uyumlu (run_embedding deseni); NDJSON stream'i satir-satir okur (token Channel).
ureq = { version = "2", features = ["json"] }
# P2.5 klasor watcher (canli izleme) — H2 pariti. Platform-optimal FS izleme
# (Windows ReadDirectoryChangesW / Linux inotify / Mac FSEvents). Recursive watch.
notify = "6"

[dev-dependencies]
# P2.6 recovery testleri: gercek dosya (bozuk DB + snapshot) → temp klasor.
tempfile.workspace = true
